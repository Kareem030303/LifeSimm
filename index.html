<!DOCTYPE html>
<html>
<head>
<title>LifeSim 2.0</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>🌎 LifeSim 2.0</h1>

<div class="box">

<h2>Create Your Avatar</h2>

<input id="name" placeholder="Name">

<select id="country">
<option>United States</option>
<option>Japan</option>
<option>Brazil</option>
<option>Mexico</option>
<option>France</option>
</select>

<button onclick="startLife()">Start Life</button>

</div>


<div class="box" id="life" style="display:none">

<h2 id="profile"></h2>

<p id="family"></p>

<p id="stats"></p>

<h3>📖 Life Story</h3>

<div id="story"></div>

<button onclick="ageUp()">Age Up</button>

</div>


<script src="script.js"></script>

</body>
</html>
