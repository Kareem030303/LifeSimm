<!DOCTYPE html>
<html>
<head>
<title>LifeSimm Family</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<h1>👨‍👩‍👧 Create Your Family</h1>

<div class="box">

<input id="name" placeholder="Your Name">

<input id="father" placeholder="Father Name">

<input id="mother" placeholder="Mother Name">

<input id="sibling" placeholder="Sibling Name">

<button onclick="createFamily()">Create Family</button>

</div>


<div id="result"></div>


<script>

function createFamily(){

let name = document.getElementById("name").value;
let father = document.getElementById("father").value;
let mother = document.getElementById("mother").value;
let sibling = document.getElementById("sibling").value;


document.getElementById("result").innerHTML = `

<h2>${name}'s Life</h2>

<p>👨 Father: ${father}</p>

<p>👩 Mother: ${mother}</p>

<p>👦 Sibling: ${sibling}</p>

<p>❤️ Family Relationship: 100%</p>

<button onclick="begin()">Begin Life</button>

`;

}


function begin(){

alert("Your life has started! 🎉");

}

</script>

</body>
</html>
