<!DOCTYPE html>
<html>
<head>
<title>LifeSimm - Family</title>

<style>
body {
    font-family: Arial;
    background: #222;
    color: white;
    text-align: center;
}

.container {
    background: #333;
    padding: 20px;
    margin: 30px auto;
    width: 350px;
    border-radius: 10px;
}

input, button {
    padding: 10px;
    margin: 5px;
    width: 90%;
}

button {
    background: green;
    color: white;
    border: none;
    cursor: pointer;
}

.family-box {
    background: #444;
    padding: 15px;
    margin-top: 20px;
}
</style>

</head>

<body>

<h1>🏠 LifeSimm Family Creator</h1>

<div class="container">

<h2>Create Your Family</h2>

<input id="player" placeholder="Your Name">

<input id="father" placeholder="Father's Name">

<input id="mother" placeholder="Mother's Name">

<input id="sibling" placeholder="Sibling's Name">

<button onclick="createFamily()">Create Family</button>

<div class="family-box" id="familyDisplay">
</div>

</div>


<script>

function createFamily(){

let player = document.getElementById("player").value;
let father = document.getElementById("father").value;
let mother = document.getElementById("mother").value;
let sibling = document.getElementById("sibling").value;


document.getElementById("familyDisplay").innerHTML = `

<h2>${player}'s Family</h2>

<p>👨 Father: ${father}</p>

<p>👩 Mother: ${mother}</p>

<p>👦 Sibling: ${sibling}</p>

<p>❤️ Family Bond: 100%</p>

`;

}

</script>

</body>
</html>
<h2>Age: <span id="age">0</span></h2>

<button onclick="ageUp()">Age Up</button>

<div id="event"></div>


<script>

let age = 0;


function ageUp(){

age++;

document.getElementById("age").innerHTML = age;


let event = "";


if(age == 1){
event = "👶 You learned to walk and started exploring the world.";
}

else if(age == 3){
event = "🧸 You started preschool and began making friends.";
}

else if(age == 5){
event = "🎒 You started elementary school.";
}

else if(age == 10){
event = "📚 You are learning more subjects and building your personality.";
}

else if(age == 13){
event = "🏫 You entered middle school. Friendships and interests start changing.";
}

else if(age == 15){
event = "🚗 You are becoming more independent and discovering your goals.";
}

else if(age == 16){
event = "🎓 You can start learning skills for your future career.";
}

else if(age == 18){
event = "🎉 You became an adult. You can choose college, work, or training.";
}

else if(age == 21){
event = "💼 You are building your adult life and career.";
}

else if(age == 25){
event = "🏠 Many people begin serious careers, relationships, and independence.";
}

else if(age == 30){
event = "📈 Your experience grows. Career and family decisions become important.";
}

else if(age == 40){
event = "👨‍👩‍👧 You enter a new stage of life with more responsibilities.";
}

else if(age == 60){
event = "🌅 Retirement planning and health become more important.";
}

else if(age == 80){
event = "👴 You are entering your later years and reflecting on your journey.";
}

else {
event = "📅 Another year passes. Your life continues to change.";
}


document.getElementById("event").innerHTML = event;

}

</script>
